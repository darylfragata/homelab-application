trigger: none
pr: none

pool:
  name: AWS-Agents # self-hosted agent pool

stages:
  - stage: DevAppBucketSync
    displayName: "Sync tfvars (dev-app)"
    dependsOn: [] # explicit - no dependency, runs automatically on every trigger
    jobs:
      - deployment: DevAppBucketSync
        displayName: "Sync tfvars (dev-app) to agent"
        variables:
          - group: dev-app # ADO Library variable group - supplies tfvarsUri
        environment: dev-app-deployment # ADO Environment - approval gate configured in Library UI, not here
        strategy:
          runOnce:
            deploy:
              steps:
                - template: /templates/tfvars-sync.yml
                  parameters:
                    tfvarsFile: dev-app
                    tfvarsS3Uri: $(tfvarsUri) # from ADO Library variable group

  - stage: ProdAppBucketSync
    displayName: "Sync tfvars (prod-app)"
    dependsOn: [] # explicit - no dependency, runs automatically on every trigger
    jobs:
      - deployment: ProdAppBucketSync
        displayName: "Sync tfvars (prod-app) to agent"
        variables:
          - group: prod-app # ADO Library variable group - supplies tfvarsUri
        environment: prod-app-deployment # ADO Environment - approval gate configured in Library UI, not here
        strategy:
          runOnce:
            deploy:
              steps:
                - template: /templates/tfvars-sync.yml
                  parameters:
                    tfvarsFile: prod-app
                    tfvarsS3Uri: $(tfvarsUri) # from ADO Library variable group
