parameters:
- name: envDir      # directory for the environment's Terraform configuration, e.g. dev, prod
  type: string

steps:
- checkout: self

- script: terraform init -reconfigure
  displayName: 'Terraform Init (${{ parameters.envDir }})'
  workingDirectory: envs/${{ parameters.envDir }}

- download: current
  artifact: tfplan-${{ parameters.envDir }}
  displayName: 'Download plan (${{ parameters.envDir }})'

- script: cp "$(Pipeline.Workspace)/tfplan-${{ parameters.envDir }}/tfplan" ./tfplan
  displayName: 'Stage plan file (${{ parameters.envDir }})'
  workingDirectory: envs/${{ parameters.envDir }}

- script: terraform apply -auto-approve tfplan
  displayName: 'Terraform Apply (${{ parameters.envDir }})'
  workingDirectory: envs/${{ parameters.envDir }}
